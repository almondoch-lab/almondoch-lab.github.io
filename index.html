<title>김포고 실시간 GPS 지도</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#0b1220;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white;overflow:hidden}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1220}
#mapWrap{position:relative;max-width:100vw;max-height:100vh;display:inline-block}
#map{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
#overlay{position:absolute;inset:0;pointer-events:none}
#accuracy{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.4);display:none}
#me{position:absolute;transform:translate(-50%,-50%);display:none;transition:left .35s linear,top .35s linear;z-index:4}
#me .dot{width:22px;height:22px;border-radius:50%;background:#0A84FF;border:4px solid white;box-shadow:0 0 0 8px rgba(10,132,255,.24),0 3px 12px rgba(0,0,0,.35)}
#me .label{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(5,10,18,.82);padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;backdrop-filter:blur(8px)}
#status{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:rgba(5,10,18,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;max-width:calc(100vw - 20px);overflow:hidden;text-overflow:ellipsis}
#status.good{background:rgba(18,112,55,.9)}
#status.warn{background:rgba(140,86,0,.9)}
#status.bad{background:rgba(145,28,28,.9)}
#outside{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;background:rgba(145,28,28,.9);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;display:none}
</style>

<div id="outside">현재 위치가 지도 범위를 벗어났습니다.</div>
<div id="status">위치 확인 중…</div>

<script>
(() => {
  const map = document.getElementById('map');
  const mapWrap = document.getElementById('mapWrap');
  const me = document.getElementById('me');
  const accuracyCircle = document.getElementById('accuracy');
  const status = document.getElementById('status');
  const outside = document.getElementById('outside');

  // 이 지도에 미리 내장한 좌표 변환값.
  // 공개 좌표 자료의 학교 건물 위치를 이용해 사용자가 별도 기준점을 찍지 않도록 구성했다.
  const REF_LAT = 37.61901;
  const REF_LON = 126.71248;

  // East/North(m) -> normalized image x/y
  // 제공된 김포고 지도 이미지에 맞춘 affine transform
  const TX = [0.01174329, 0.00120464, 0.31250000];
  const TY = [0.00156125,-0.00817849, 0.21024967];

  let filtered = null;
  let lastRaw = null;

  function metersFromRef(lat, lon) {
    const east = (lon - REF_LON) * 111320 * Math.cos(REF_LAT * Math.PI / 180);
    const north = (lat - REF_LAT) * 110540;
    return [east, north];
  }

  function toMap(lat, lon) {
    const [e,n] = metersFromRef(lat, lon);
    return {
      x: TX[0]*e + TX[1]*n + TX[2],
      y: TY[0]*e + TY[1]*n + TY[2]
    };
  }

  function distanceMeters(a,b) {
    if(!a || !b) return 0;
    const lat0=(a.lat+b.lat)/2*Math.PI/180;
    const dy=(b.lat-a.lat)*110540;
    const dx=(b.lon-a.lon)*111320*Math.cos(lat0);
    return Math.hypot(dx,dy);
  }

  function smoothPosition(lat, lon, acc, t) {
    const raw={lat,lon,acc,t};
    if(!filtered) {
      filtered={...raw};
      lastRaw=raw;
      return filtered;
    }

    const dt=Math.max(0.2,(t-filtered.t)/1000);
    const rawMove=distanceMeters(lastRaw,raw);
    const speed=rawMove/Math.max(0.2,(t-lastRaw.t)/1000);

    // 이동 중엔 반응성을 높이고, 정지 중엔 GPS 흔들림을 더 강하게 줄인다.
    let alpha;
    if(speed > 1.2) alpha=0.78;
    else if(speed > 0.35) alpha=0.58;
    else alpha=Math.max(0.16,Math.min(0.42,8/(Math.max(acc,1)+8)));

    // 정확도가 나쁜 순간값은 덜 반영
    if(acc > 25) alpha*=0.45;
    if(acc > 50) alpha*=0.20;

    filtered.lat = filtered.lat + alpha*(lat-filtered.lat);
    filtered.lon = filtered.lon + alpha*(lon-filtered.lon);
    filtered.acc = acc;
    filtered.t = t;
    lastRaw=raw;
    return filtered;
  }

  function setStatus(text, cls='') {
    status.textContent=text;
    status.className=cls;
  }

  function drawAccuracy(x,y,meters) {
    if(!Number.isFinite(meters)) {
      accuracyCircle.style.display='none';
      return;
    }
    const rect=map.getBoundingClientRect();
    // 변환식으로부터 대략적인 px/m를 계산
    const pxPerMeterX=Math.hypot(TX[0]*rect.width,TY[0]*rect.height);
    const pxPerMeterN=Math.hypot(TX[1]*rect.width,TY[1]*rect.height);
    const pxPerMeter=(pxPerMeterX+pxPerMeterN)/2;
    const size=Math.max(18,Math.min(Math.max(rect.width,rect.height)*1.5,meters*2*pxPerMeter));
    accuracyCircle.style.width=size+'px';
    accuracyCircle.style.height=size+'px';
    accuracyCircle.style.left=(x*100)+'%';
    accuracyCircle.style.top=(y*100)+'%';
    accuracyCircle.style.display='block';
  }

  function renderPosition(pos) {
    const c=pos.coords;
    const p=smoothPosition(c.latitude,c.longitude,Number(c.accuracy)||999,pos.timestamp||Date.now());
    const m=toMap(p.lat,p.lon);

    const inBounds=m.x>=0 && m.x<=1 && m.y>=0 && m.y<=1;
    outside.style.display=inBounds?'none':'block';

    if(inBounds) {
      me.style.left=(m.x*100)+'%';
      me.style.top=(m.y*100)+'%';
      me.style.display='block';
      drawAccuracy(m.x,m.y,c.accuracy);
    } else {
      me.style.display='none';
      accuracyCircle.style.display='none';
    }

    const a=Number(c.accuracy);
    if(Number.isFinite(a)) {
      if(a<=1) setStatus('정밀 위치 · ±'+a.toFixed(1)+' m','good');
      else if(a<=5) setStatus('실시간 위치 · ±'+a.toFixed(1)+' m','good');
      else if(a<=15) setStatus('실시간 위치 · ±'+a.toFixed(1)+' m','warn');
      else setStatus('위치 수신 중 · ±'+a.toFixed(0)+' m','warn');
    } else {
      setStatus('실시간 위치 수신 중','good');
    }
  }

  function onError(err) {
    me.style.display='none';
    accuracyCircle.style.display='none';
    if(err.code===1) setStatus('브라우저에서 위치 사용이 허용되지 않았습니다.','bad');
    else if(err.code===2) setStatus('현재 위치를 계산하지 못했습니다.','bad');
    else setStatus('위치 신호를 기다리는 중입니다.','warn');
  }

  function start() {
    if(location.protocol!=='https:') {
      setStatus('HTTPS에서만 실시간 위치를 사용할 수 있습니다.','bad');
      return;
    }
    if(!navigator.geolocation) {
      setStatus('이 브라우저는 위치 기능을 지원하지 않습니다.','bad');
      return;
    }
    setStatus('위치 확인 중…');
    navigator.geolocation.watchPosition(
      renderPosition,
      onError,
      {enableHighAccuracy:true,maximumAge:0,timeout:15000}
    );
  }

  if(document.readyState==='loading') {
    document.addEventListener('DOMContentLoaded',start,{once:true});
  } else {
    start();
  }
})();
